<script>
/* Controllo di avvio: se dopo 15 s l'app è ancora su "Caricamento", mostra cosa manca. */
window.__log=[];window.__err=[];
addEventListener('error',function(e){var t=e.target;__err.push(t&&t!==window&&(t.src||t.href)?'File non caricato: '+(t.src||t.href):((e.filename||'').split('/').pop()+':'+e.lineno+'  '+e.message));},true);
addEventListener('unhandledrejection',function(e){var r=e.reason;__err.push('Promise: '+(r&&(r.code||r.message)||r));});
setTimeout(function(){
  var a=document.getElementById('app');if(!a||a.textContent.indexOf('Caricamento')<0)return;
  var ok=function(b){return b?'✅':'❌'},esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
  var c=[['Librerie Firebase',typeof firebase!=='undefined'],['config.js',typeof CFG!=='undefined'],['app.js avviato',!!window.__appOK],['Connessione internet',navigator.onLine],['Aperto da web (non da file)',location.protocol.indexOf('http')===0]];
  a.innerHTML='<div class="login"><h2>🔧 Diagnosi avvio</h2><p>Mandami una foto di questa schermata.</p><div style="text-align:left">'+c.map(function(x){return ok(x[1])+' '+x[0]}).join('<br>')+
  '</div><pre>'+esc((__err.length?'ERRORI:\n'+__err.join('\n')+'\n\n':'Nessun errore JavaScript\n\n')+'PASSAGGI:\n'+(__log.join('\n')||'(nessuno)')+'\n\n'+location.href)+'</pre><button class="pri" onclick="location.reload()">Ricarica</button></div>';
},15000);
</script>
<link rel="stylesheet" href="style.css?v=7">
</head><body>
<header><img class="hlogo" src="icon.svg" alt=""><div class="htitle"><h1>Famiglia</h1><small id="who"></small></div><button id="inst" class="sm ghost" hidden>📲 Installa</button><button id="out" class="sm ghost" hidden>Esci</button></header>
<div id="app"><p class="c">Caricamento…</p></div>
<div id="toast" role="status"></div>

</body></html>
