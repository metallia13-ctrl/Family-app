<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Famiglia — Gestione Genitori</title>
<style>
:root{--bg:#edf2f0;--card:#fff;--ink:#1c2a29;--mut:#66787a;--ac:#0f6b66;--ac-soft:#e0f0ee;--yes:#2d7a4d;--no:#b24a5c;--note:#fff4c2;--ln:#d5dfdc;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#131c1b;--card:#1d2827;--ink:#e6efed;--mut:#93a6a6;--ac:#4cc2b8;--ac-soft:#193835;--yes:#5cc58a;--no:#e88a99;--note:#3b3615;--ln:#2e3d3b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 50px}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
header h1{font-size:19px;margin:0;flex:1}
header small{opacity:.9}
nav{display:flex;gap:6px;padding:10px 12px 0;max-width:780px;margin:auto;overflow-x:auto}
nav button{flex:1 0 auto;font-weight:500}
main{max-width:780px;margin:auto;padding:12px}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.9}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button.yes.on{background:var(--yes);border-color:var(--yes)}button.no.on{background:var(--no);border-color:var(--no)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.sm{padding:4px 9px;font-size:13px;border-radius:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea,select{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.add input[type=text]{flex:1;min-width:150px}
.task{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--ln)}
.task.done{opacity:.6}
.th{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.th b{flex:1;font-size:17px;min-width:140px}
.due{color:var(--mut);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chip{font-size:13px;padding:3px 9px;border-radius:99px;border:1px solid currentColor;display:inline-flex;align-items:center;gap:4px}
.chip.yes{color:var(--yes)}.chip.no{color:var(--no)}
.notes{margin-top:12px;display:grid;gap:10px}
.note{background:var(--note);border-radius:12px;padding:12px;border:1px solid var(--ln)}
.note textarea{width:100%;min-height:68px;background:transparent;border:0;resize:vertical;padding:2px}
.note-hdr{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:4px;gap:6px;flex-wrap:wrap}
.it{display:flex;gap:6px;align-items:center;margin:3px 0}.it input[type=text]{flex:1;background:transparent;border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:3px}
.it .x{padding:2px 8px}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.imgs div{position:relative}
.imgs img{height:90px;border-radius:8px;display:block}.imgs .x{position:absolute;top:2px;right:2px;padding:0 7px}
.files a{display:inline-block;margin:2px 8px 2px 0;color:var(--ac)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tools button{padding:4px 10px;font-size:13.5px}
.c{text-align:center;padding:40px 16px;color:var(--mut)}
.mem{display:flex;gap:10px;align-items:center;background:var(--card);padding:10px 12px;border-radius:12px;margin-bottom:8px;border:1px solid var(--ln)}.mem span{flex:1}
:root{--u1:#c27a00;--u2:#c0392b}@media(prefers-color-scheme:dark){:root{--u1:#f0b04a;--u2:#ff7a6b}}
.u0{--u:var(--mut)}.u1{--u:var(--u1)}.u2{--u:var(--u2)}
.task,.note{border-left:5px solid var(--u,var(--ln))}
.ub{font-size:12.5px;color:var(--u);border:1px solid var(--u);border-radius:99px;padding:2px 9px;background:transparent;white-space:nowrap}
.wk{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}.wk button{flex:1;min-width:90px;padding:8px 6px;font-size:14px;line-height:1.25}
.tl{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.tr{display:flex;align-items:center;gap:8px;margin:5px 0}.tr>b{width:64px;flex:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{position:relative;flex:1;height:22px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--bg) 0 calc(100%/15 - 1px),var(--ln) calc(100%/15 - 1px) calc(100%/15))}
.bar{position:absolute;top:3px;bottom:3px;border-radius:4px;background:var(--c)}
.bar.busy{background:repeating-linear-gradient(45deg,var(--c) 0 4px,transparent 4px 8px);border:1px solid var(--c)}
.bar.tsk{background:transparent;border:2px solid var(--c)}
.hz{display:flex;flex:1;height:24px;border-radius:6px;overflow:hidden;border:1px solid var(--ln)}
.hz i{flex:1;font-style:normal;font-size:10px;text-align:center;line-height:22px}
.ax{display:flex;justify-content:space-between;margin-left:72px;font-size:11px;color:var(--mut)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:12px}
.sw{display:inline-block;width:18px;height:10px;border-radius:3px;border:1px solid var(--mut);vertical-align:middle}
.sw.f{background:var(--mut)}.sw.b{background:repeating-linear-gradient(45deg,var(--mut) 0 3px,transparent 3px 6px)}.sw.t{border-width:2px}
h3{font-size:15.5px;margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.lb{display:block;font-size:13px;color:var(--mut);margin-top:8px}.lb input,.lb textarea{display:block;width:100%;color:var(--ink);font-size:15.5px;margin-top:3px}.lb textarea{min-height:58px;resize:vertical}
.add .lb{margin:0}.add .lb input{width:auto}
.tp{display:grid;grid-template-columns:1.3fr .9fr 1fr 1.2fr .9fr auto;gap:6px;margin:8px 0;padding:8px;background:var(--bg);border-radius:10px;border:1px solid var(--ln);align-items:center}
@media(max-width:640px){.tp{grid-template-columns:1fr 1fr;}.tp input{width:100%}}
.tp input{min-width:0;font-size:14.5px;padding:6px 8px}
a{color:var(--ac)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;margin-bottom:12px}
.pcard{background:var(--card);border:1px solid var(--ln);border-top:4px solid var(--ac);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pcard-top{display:flex;justify-content:space-between;align-items:center}
.pcard-top b{font-size:17px}
.feed-box{background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:12px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.feed-box h3{margin:0 0 10px;color:var(--ac);font-size:16px;justify-content:space-between}
.feed-list{max-height:310px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.feed-item{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:14px;border-left:3px solid var(--c,var(--ac))}
.feed-item .fi-txt{flex:1}
.sec-box{border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:12px;background:var(--bg)}
.sec-box h4{margin:0 0 8px;font-size:15px;color:var(--ac);display:flex;align-items:center;gap:6px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 12px}
.form-grid .full{grid-column:1/-1}
.vit-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--card);padding:6px 10px;border-radius:8px;border:1px solid var(--ln);font-size:13.5px;margin-top:4px}
.badge{background:var(--ac-soft);color:var(--ac);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:9;max-width:90%;box-shadow:0 4px 12px rgba(0,0,0,.25)}
</style></head><body>
<header><h1>🏠 Famiglia · Genitori</h1><small id="who"></small><button id="out" hidden>Esci</button></header>

<script src="[https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js](https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js)"></script>
<script src="[https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js](https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js)"></script>

<script>
const CFG = {
  apiKey: "AIzaSyCNnQR9hSPE8ItBP1i52nCCbXo2wpAOA90",
  authDomain: "app-famiglia-aac7e.firebaseapp.com",
  projectId: "app-famiglia-aac7e",
  storageBucket: "app-famiglia-aac7e.firebasestorage.app",

  appId: "1:696565007260:web:a5c6f84e188e7930d1fe59"

const $=s=>document.querySelector(s),
 esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
 rid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36),
 fmt=v=>{try{return new Date(v).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return v}};
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let me,D,S={members:{},tasks:{},notes:{},events:{},people:{},contacts:{},shifts:{},feed:{}},open=new Set(),psel=null,nfil='all',tab='h',day=iso(new Date()),pend=false,watching=false,asked=false,seeded=false;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}

function localDB(){const k='famiglia_demo',g=()=>{const s=JSON.parse(localStorage[k]||'{}');for(const c of['members','tasks','notes','events','people','contacts','shifts','feed'])s[c]=s[c]||{};return s},cb={};
 const fire=()=>{const s=g();for(const c in cb)cb[c](s[c])};
 return{watchDoc(c,i,f){cb[c+'_'+i]=()=>f(g()[c][i]);f(g()[c][i])},
  watch(c,f){cb[c]=f;f(g()[c])},
  put(c,i,d,m){const s=g(),o=s[c][i]||{};s[c][i]=m?{...o,...d,...(d.sel?{sel:{...o.sel,...d.sel}}:{})}:d;localStorage[k]=JSON.stringify(s);fire()},
  del(c,i){const s=g();delete s[c][i];localStorage[k]=JSON.stringify(s);fire()}}}

function fbDB(){firebase.initializeApp(CFG);const f=firebase.firestore();
 return{
  watchDoc:(c,i,cb)=>f.collection(c).doc(i).onSnapshot(d=>cb(d.exists?d.data():null),e=>toast('Errore profilo: '+e.code)),
  watch:(c,cb)=>(c=='feed'?f.collection(c).orderBy('ts','desc').limit(80):f.collection(c)).onSnapshot(q=>{const o={};q.forEach(d=>o[d.id]=d.data());cb(o)},e=>toast('Errore '+c+': '+e.code)),
  put:(c,i,d,m)=>(m?f.collection(c).doc(i).set(d,{merge:true}):f.collection(c).doc(i).set(d)).catch(e=>toast('Non consentito: '+e.code)),
  del:(c,i)=>f.collection(c).doc(i).delete().catch(e=>toast('Non consentito: '+e.code))}}

function init(){
 if(!CFG){D=localDB();me={uid:'me',name:'Tu (demo)'};D.put('members','me',{name:me.name,role:'admin',color:PAL[0]},1);start();return}
 D=fbDB();
 firebase.auth().onAuthStateChanged(u=>{
  if(!u){$('#app').innerHTML='<p class="c">Accedi per coordinare la gestione di Babbo e Mamma.<br><br><button class="pri" data-a="login">Accedi con Google</button></p>';return}
  me={uid:u.uid,name:u.displayName||u.email};$('#out').hidden=false;start()})}

function start(){
 $('#who').textContent=me.name;
 D.watchDoc('members',me.uid,myDoc=>{
  if(!myDoc&&!asked&&CFG){
   asked=true;
   D.put('members',me.uid,{name:me.name,role:'pending',color:PAL[[...me.uid].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length]});
   return;
  }
  if(!myDoc)return;
  S.members[me.uid]=myDoc;
  const r=myDoc.role;
  if(r&&r!='pending'&&!watching){
   watching=true;
   D.watch('members',o=>{S.members=o;render()});
   D.watch('tasks',t=>{S.tasks=t;render()});
   D.watch('notes',n=>{S.notes=n;render()});
   D.watch('people',p=>{
    S.people=p;
    if(!seeded&&Object.keys(p).length===0&&['editor','admin'].includes((S.members[me.uid]||{}).role)){
     seeded=true;
     D.put('people','babbo',{name:'Babbo',therapy:[],vitals:[]});
     D.put('people','mamma',{name:'Mamma',therapy:[],vitals:[]});
    }
    render();
   });
   ['events','contacts','shifts','feed'].forEach(c=>D.watch(c,v=>{S[c]=v;render()}));
  }
  render();
 });
}

const SECTIONS = [
 { title: '📋 Anagrafica, Documenti e Burocrazia', fields: [
   ['born','Data di nascita','date',''],
   ['bplace','Luogo e Provincia di nascita','text','es. Cagliari (CA)'],
   ['cf','Codice Fiscale','text','16 caratteri'],
   ['tess_num','N° Tessera Sanitaria (TEAM)','text','8038000...'],
   ['tess','Scadenza Tessera Sanitaria','date',''],
   ['cid','N° Carta di Identità e Scadenza','text','es. CA12345AA - scad. 10/2029'],
   ['exempt','Esenzioni Ticket (codici)','text','es. E01, C01, 031 (ipertensione)...'],
   ['inval','Invalidità Civile / Legge 104 / Accompagnamento','text','es. 100% con accompagno, verbale del...'],
   ['where','Dove sono chiavi, documenti, SPID/PIN e referti','area','es. Cartellina blu nello studio, copia chiavi da...','full']
 ]},
 { title: '🩺 Profilo Clinico e Sanitario', fields: [
   ['blood','Gruppo sanguigno e fattore Rh','text','es. 0 Rh+'],
   ['base_vit','Valori basali abituali (PA, FC, Peso, SpO2)','text','es. PA abituale 130/75, FC 68 bpm, 72 kg'],
   ['allergies_med','⚠️ ALLERGIE A FARMACI','area','es. Penicilline (orticaria), FANS... Scrivere Nessuna nota se assenti','full'],
   ['allergies','Allergie ambientali e Intolleranze alimentari','area','es. Lattosio, nichel, pollini...','full'],
   ['conditions','Patologie croniche e diagnosi attive','area','es. Ipertensione arteriosa, Diabete tipo 2, FA, Artrosi...','full'],
   ['surgeries','Interventi chirurgici pregressi e ricoveri','area','es. Cataratta OD (2021), Protesi anca (2019)...','full'],
   ['vaccines','Vaccinazioni (Antinfluenzale, Covid, Pneumococco, Zoster)','text','es. Antinfluenzale ott 2025, Zoster 2024','full']
 ]},
 { title: '🏥 Medici, Specialisti e Rete Curante', fields: [
   ['doctor','Medico di Medicina Generale (MMG) e Telefono','text','es. Dott. Bianchi - 333 1234567'],
   ['doc_hours','Orari ambulatorio MMG e modalità ricette','area','es. Lun-Mer-Ven 9-12, Mar-Gio 16-19. Ricette via mail/app...','full'],
   ['spec','Specialisti, Ospedale e Centri di riferimento','area','es. Cardiologia Osp. Civile (Dott. Verdi), Diabetologia...','full'],
   ['pharmacy','Farmacia di fiducia (nome, tel, orari)','text','es. Farmacia Centrale - 070 123456'],
   ['caregiver','Assistenza domiciliare (ADI, Infermiere, Badante, Fisio)','text','es. Sig.ra Maria (lun-ven 9-13) - tel...'],
   ['emerg','Contatti di emergenza (chi chiamare per primo)','text','es. Figlio/a 1: 340... / Figlio/a 2: 347...','full']
 ]},
 { title: '🕰️ Orari, Routine, Ausili e Vita Quotidiana', fields: [
   ['schedule','Orari e routine giornaliera (sveglia, pasti, riposo, sonno)','area','es. Sveglia 07:30, Colazione 08:00, Pranzo 12:30, Riposino 14-15:30, Cena 19:30, Letto 22:00','full'],
   ['mobility','Mobilità, autonomia e Rischio Cadute','area','es. Cammina in casa con bastone, fuori serve braccio/carrozzina. Attenzione ai tappeti','full'],
   ['aids','Ausili in uso (occhiali, acustici, dentiera, deambulatore, presidi)','area','es. Occhiali da lettura, Protesi acustica (pile tipo 312), Traversine letto','full'],
   ['diet','Dieta, idratazione e alimenti da evitare','area','es. Dieta iposodica, bere almeno 1.5L/die, tagliare piccolo (attenzione disfagia)','full'],
   ['cognitive','Umore, sonno, orientamento e abitudini','area','es. Lucido ma a volte dimentica se ha preso la pastiglia; ama guardare la TV alle 18','full'],
   ['safety','Sicurezza in casa (gas, stufe, chiavi, vicini di fiducia)','area','es. Chiudere rubinetto gas la sera. Vicina piano terra (Sig.ra Anna) ha le chiavi','full']
 ]}
];
const FL = SECTIONS.flatMap(s=>s.fields);

const role=()=>(S.members[me.uid]||{}).role,isEd=()=>['editor','admin'].includes(role());
function render(){
 const a=document.activeElement;
 if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.closest('main')&&a.type!='checkbox'){pend=true;return}
 pend=false;const R=role(),app=$('#app');
 if(!R)return;
 if(R=='pending'){app.innerHTML='<p class="c">Accesso richiesto ✔<br>Attendi che l\'amministratore ti autorizzi (oppure, se sei l\'amministratore, vai su Firebase → Firestore → members → cambia il tuo role da "pending" ad "admin").</p>';return}
 const adm=R=='admin';
 const tabs=[['h','🏠 Home'],['d','👴👵 Schede Genitori'],['n','📝 Note'],['t','✅ Impegni'],['s','🚪 Turni'],['c','📅 Calendario']].concat(adm?[['p','🔑 Accessi']]:[]);
 let h='<nav>'+tabs.map(([v,l])=>'<button data-a="tab" data-v="'+v+'" class="'+(tab==v?'on':'')+'">'+l+'</button>').join('')+'</nav><main>';
 if(tab=='h')h+=home();
 else if(tab=='d')h+=schede();
 else if(tab=='n')h+=notesTab();
 else if(tab=='c')h+=cal();
 else if(tab=='s')h+=shifts();
 else if(tab=='p'&&adm){
  h+='<p class="due">Visualizzatore: vede tutto, segna disponibilità, turni e parametri. Editor: crea e modifica schede, farmaci, impegni e note. Admin: gestisce anche gli accessi.</p>';
  for(const[u,m]of Object.entries(S.members))h+='<div class="mem"><span>'+esc(m.name)+'</span><select data-c="role" data-i="'+u+'">'+[['pending','In attesa'],['viewer','Visualizzatore'],['editor','Editor'],['admin','Admin']].map(([v,l])=>'<option value="'+v+'" '+(m.role==v?'selected':'')+'>'+l+'</option>').join('')+'</select></div>';
 }else{
  if(isEd())h+='<div class="add"><input type="text" id="nt" placeholder="Nuovo impegno (es. Ritirare farmaci, Prenotare analisi…)" aria-label="Nuovo impegno"><select id="nk" aria-label="Tipo"><option value="">Impegno generico</option><option value="med">🩺 Visita / Esame medico</option></select><select id="np" aria-label="Per chi">'+popt('Per chi: entrambi / tutti')+'</select><label class="lb">Scadenza<input type="date" id="nd"></label><label class="lb">Data e ora visita<input type="datetime-local" id="na"></label><select id="nr" aria-label="Ripetizione"><option value="">Non si ripete</option><option value="d">Ogni giorno</option><option value="w">Ogni settimana</option><option value="m">Ogni mese</option></select><button class="pri" data-a="addt">Aggiungi</button></div>';
  const ts=Object.entries(S.tasks).sort((x,y)=>(x[1].done?1:0)-(y[1].done?1:0)||(y[1].urg||0)-(x[1].urg||0)||(x[1].due||'9').localeCompare(y[1].due||'9'));
  if(!ts.length)h+='<p class="c">Nessun impegno in lista. '+(isEd()?'Aggiungine uno qui sopra.':'')+'</p>';
  for(const[i,t]of ts)h+=task(i,t);
 }
 app.innerHTML=h+'</main>'}

function task(i,t){

 h+='<div class="sec-box"><h4>❤️ Parametri Vitali e Misurazioni ('+esc(p.name)+')</h4><div class="add" style="margin-bottom:6px"><input type="text" id="vpa" placeholder="Pressione (es. 125/80)" style="flex:1;min-width:120px"><input type="text" id="vfc" placeholder="FC bpm (es. 72)" style="width:110px"><input type="text" id="vsp" placeholder="SpO2 % (es. 97)" style="width:115px"><input type="text" id="vgl" placeholder="Glicemia / Temp" style="width:130px"><input type="text" id="vw" placeholder="Peso kg" style="width:90px"><input type="text" id="vnt" placeholder="Note (es. a digiuno, capogiro…)" style="flex:1;min-width:140px"><button class="pri sm" data-a="addvit">Registra</button></div>'+(vits.length?vits.slice(0,8).map((v)=>'<div class="vit-row"><b>'+new Date(v.ts).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</b>'+(v.pa?'<span class="badge">PA: '+esc(v.pa)+'</span>':'')+(v.fc?'<span class="badge">FC: '+esc(v.fc)+' bpm</span>':'')+(v.spo2?'<span class="badge">SpO2: '+esc(v.spo2)+'%</span>':'')+(v.gl?'<span class="badge">Glic/T: '+esc(v.gl)+'</span>':'')+(v.w?'<span class="badge">Peso: '+esc(v.w)+' kg</span>':'')+'<span style="flex:1" class="due">'+esc(v.note||'')+' · <i>'+esc((S.members[v.uid]||{}).name||'')+'</i></span>'+(ed?'<button class="x sm" data-a="delvit" data-j="'+v.ts+'">×</button>':'')+'</div>').join(''):'<div class="due">Nessuna rilevazione ancora registrata.</div>')+'</div>';

 for(const sec of SECTIONS){
  h+='<div class="sec-box"><h4>'+sec.title+'</h4><div class="form-grid">';
  for(const[f,l,ty,ph,cls]of sec.fields){
   const v=esc(p[f]||'');
   h+='<label class="lb '+(cls||'')+'">'+l+(ty=='area'?'<textarea data-c="sc" data-f="'+f+'" placeholder="'+esc(ph||'')+'" '+dis+'>'+v+'</textarea>':'<input type="'+ty+'" data-c="sc" data-f="'+f+'" placeholder="'+esc(ph||'')+'" value="'+v+'" '+dis+'>')+'</label>';
  }
  h+='</div></div>';
 }

 const ns=Object.entries(S.notes).filter(([,n])=>n.task==psel).sort((a,b)=>b[1].ts-a[1].ts);
 return h+'<div class="sec-box"><h4>📝 Note, Referti e Checklist di '+esc(p.name)+'</h4><div class="notes">'+ns.map(([k,n])=>note(k,n,ed,false)).join('')+(ed?'<div><button class="pri sm" data-a="addn" data-i="'+psel+'">+ Nuova nota per '+esc(p.name)+'</button></div>':'')+'</div></div></div>'+cont;
}

function notesTab(){
 const ed=isEd(),pe=Object.entries(S.people);
 let h='<div class="wk"><button data-a="nfil" data-v="all" class="'+(nfil=='all'?'on':'')+'">Tutte le note</button><button data-a="nfil" data-v="gen" class="'+(nfil=='gen'?'on':'')+'">📌 Bacheca Generale</button>'+pe.map(([pi,p])=>'<button data-a="nfil" data-v="'+pi+'" class="'+(nfil==pi?'on':'')+'">👤 '+esc(p.name)+'</button>').join('')+'</div>';
 if(ed){
  h+='<div class="add" style="margin-top:10px"><select id="n_target" aria-label="Associa nota a"><option value="gen" '+(nfil=='gen'?'selected':'')+'>📌 Bacheca Generale Famiglia</option>'+pe.map(([pi,p])=>'<option value="'+pi+'" '+(nfil==pi?'selected':'')+'>👤 Scheda di '+esc(p.name)+'</option>').join('')+'</select><input type="text" id="n_quick" placeholder="Titolo o testo rapido della nuova nota (es. Farmaci da ordinare, Spesa per Babbo…)"><button class="pri" data-a="addng">+ Crea Nota</button></div>';
 }
 const allNotes=Object.entries(S.notes).filter(([,n])=>{
  if(nfil=='all')return true;
  return n.task==nfil;
 }).sort((a,b)=>(b[1].urg||0)-(a[1].urg||0)||b[1].ts-a[1].ts);

 if(!allNotes.length) h+='<p class="c">Nessuna nota in questa vista. '+(ed?'Usa il pulsante qui sopra per crearne una (puoi aggiungere checklist, foto di ricette/referti e allegati).':'')+'</p>';
 else h+='<div class="notes">'+allNotes.map(([k,n])=>note(k,n,ed,true)).join('')+'</div>';
 return h;
}

const nt=()=>Date.now(),upd=(k,f)=>{const n=S.notes[k];if(!n)return;const c={...n,items:[...(n.items||[])],imgs:[...(n.imgs||[])],files:[...(n.files||[])]};f(c);saveNote(k,c)};
function saveNote(k,n){if(JSON.stringify(n).length>900000)return toast('Nota troppo grande (max ~900 KB): rimuovi qualcosa');S.notes[k]=n;D.put('notes',k,n);render()}
function readNote(el){const k=el.dataset.n,n=S.notes[k];if(!n)return;
 const newText=el.querySelector('textarea').value;
 saveNote(k,{...n,text:newText,ts:nt(),by:me.uid,items:[...el.querySelectorAll('.it')].map(r=>({d:r.children[0].checked,t:r.children[1].value}))});
 fd('ha aggiornato una nota'+(newText?': "'+newText.slice(0,35)+(newText.length>35?'…':'')+'"':''),S.people[n.task]?n.task:'','note');
}
function pick(accept,cb){const f=document.createElement('input');f.type='file';f.accept=accept;f.onchange=()=>f.files[0]&&cb(f.files[0]);f.click()}
const rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
async function shrink(f){const u=await rd(f),im=new Image;im.src=u;await im.decode();const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7)}

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i,j=+b.dataset.j;
 if(a=='login')return firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(x=>toast(x.code));
 if(a=='tab'){tab=b.dataset.v;return render()}
 if(a=='gosc'){psel=b.dataset.v;tab='d';return render()}
 if(a=='nfil'){nfil=b.dataset.v;return render()}
 if(a=='cday'){day=b.dataset.v;return render()}
 if(a=='today'){day=iso(new Date());return render()}
 if(a=='cnav'){const d=new Date(day+'T12:00');d.setDate(d.getDate()+ +b.dataset.v);day=iso(d);return render()}
 if(a=='addev'){const f=$('#ef').value,t=$('#eto').value,dt=$('#ed').value;if(!dt||!f||!t||t<=f)return toast('Controlla data e orari');const ty=$('#et').value;D.put('events',rid(),{uid:me.uid,type:ty,date:dt,from:f,to:t,label:$('#el').value.trim()});fd((ty=='free'?'ha indicato disponibilità il ':'ha indicato un impegno il ')+dt);day=dt;return render()}
 if(a=='delev')return D.del('events',i);
 if(a=='nurg')return upd(i,n=>{n.urg=((n.urg||0)+1)%3});
 if(a=='urg')return D.put('tasks',i,{urg:((S.tasks[i].urg||0)+1)%3},1);
 if(a=='tog'){open.has(i)?open.delete(i):open.add(i);return render()}
 if(a=='yes'||a=='no'){const t=S.tasks[i],o=(t.sel||{})[me.uid]||{};D.put('tasks',i,{sel:{[me.uid]:{st:a,when:o.when||''}}},1);if(a=='yes'&&o.st!='yes')fd('si è proposto per "'+t.title+'"',t.pid);return}
 if(a=='addt'){const t=$('#nt').value.trim();if(!t)return toast('Scrivi il titolo');const k=$('#nk').value,at=$('#na').value;if(k=='med'&&!at)return toast('Indica data e ora della visita');const o={title:t,due:$('#nd').value||at.slice(0,10),done:false,sel:{},ts:nt(),urg:0,kind:k,pid:$('#np').value,at,rep:$('#nr').value};$('#nt').value='';D.put('tasks',rid(),o);fd('ha aggiunto impegno: '+t,o.pid);return}
 if(a=='done'){const t=S.tasks[i];if(t.rep&&!t.done){const d=new Date((t.at||t.due||iso(new Date())).slice(0,10)+'T12:00');if(t.rep=='d')d.setDate(d.getDate()+1);else if(t.rep=='w')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1);const v=iso(d);D.put('tasks',i,{...t,due:v,at:t.at?v+t.at.slice(10):'',sel:{}});fd('ha completato "'+t.title+'", prossima: '+v,t.pid);return}D.put('tasks',i,{done:!t.done},1);return}
 if(a=='ics'){const t=S.tasks[i],d=new Date(t.at||t.due+'T09:00'),e=new Date(d.getTime()+36e5),f=x=>iso(x).replace(/-/g,'')+'T'+x.toTimeString().slice(0,5).replace(':','')+'00',
  v=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Famiglia//IT','BEGIN:VEVENT','UID:'+i+'@famiglia','DTSTAMP:'+f(new Date()),'DTSTART:'+f(d),'DTEND:'+f(e),'SUMMARY:'+t.title.replace(/[,;\n]/g,' '),'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Domani','END:VALARM','BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:Tra un ora','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'),
  l=document.createElement('a');l.href=URL.createObjectURL(new Blob([v],{type:'text/calendar'}));l.download='impegno.ics';l.click();return}
 if(a=='psel'){psel=b.dataset.v;return render()}
 if(a=='mkp'){D.put('people','babbo',{name:'Babbo',therapy:[],vitals:[]});D.put('people','mamma',{name:'Mamma',therapy:[],vitals:[]});fd('ha inizializzato le schede di Babbo e Mamma');return}
 if(a=='mkp1'){const n=prompt('Nome della nuova scheda (es. Zia, Nonno…)');if(n){const k=rid();psel=k;D.put('people',k,{name:n,therapy:[],vitals:[]});fd('ha creato la scheda di '+n,k)}return}
 if(a=='pren'){const n=prompt('Nome',S.people[psel].name);if(n)D.put('people',psel,{name:n},1);return}
 if(a=='pdel'){if(confirm('Eliminare la scheda e le sue note?')){Object.entries(S.notes).filter(([,n])=>n.task==psel).forEach(([k])=>D.del('notes',k));D.del('people',psel)}return}
 if(a=='cpcf'){const cf=(S.people[psel]||{}).cf;if(!cf)return toast('Nessun Codice Fiscale inserito nella scheda');navigator.clipboard?.writeText(cf.toUpperCase());return toast('Codice Fiscale copiato: '+cf.toUpperCase())}
 if(a=='sos'){
  const p=S.people[psel]||{};
  const th=(p.therapy||[]).filter(x=>x.d).map(x=>'- '+x.d+' ('+(x.q||'')+') ore '+(x.t||'')+' '+(x.n?'['+x.n+']':'')).join('\n')||'Nessuna registrata';
  const lv=(p.vitals||[]).slice().sort((a,b)=>b.ts-a.ts)[0];
  const txt='🚑 SCHEDA EMERGENZA / RIASSUNTO CLINICO: '+(p.name||'')+'\n'+
   'Nascita: '+(p.born||'—')+' ('+(p.bplace||'—')+') · CF: '+(p.cf||'—')+'\n'+
   'Gruppo Sanguigno: '+(p.blood||'—')+' · Valori basali: '+(p.base_vit||'—')+'\n'+
   '⚠️ ALLERGIE FARMACI: '+(p.allergies_med||'Nessuna nota')+'\n'+
   'Altre allergie: '+(p.allergies||'—')+'\n'+
   'PATOLOGIE: '+(p.conditions||'—')+'\n'+
   'INTERVENTI PREGRESSI: '+(p.surgeries||'—')+'\n'+
   'TERAPIA IN CORSO:\n'+th+'\n'+
   (lv?'ULTIMI PARAMETRI ('+new Date(lv.ts).toLocaleDateString('it-IT')+'): PA '+(lv.pa||'-')+', FC '+(lv.fc||'-')+', SpO2 '+(lv.spo2||'-')+'%\n':'')+
   'MMG: '+(p.doctor||'—')+' · Contatto Emergenza: '+(p.emerg||'—');
  navigator.clipboard?.writeText(txt);
  alert(txt+'\n\n(Il testo è stato anche copiato negli appunti!)');
  return;
 }
 if(a=='addth'){const preset=b.dataset.t||'';D.put('people',psel,{therapy:[...(S.people[psel].therapy||[]),{d:'',q:'',t:preset,n:'',s:''}]},1);return}
 if(a=='delth'){const th=[...(S.people[psel].therapy||[])];th.splice(j,1);D.put('people',psel,{therapy:th},1);fd('ha rimosso un farmaco dalla terapia di '+pn(psel),psel,'th');return}
 if(a=='addvit'){
  const pa=$('#vpa').value.trim(),fc=$('#vfc').value.trim(),spo2=$('#vsp').value.trim(),gl=$('#vgl').value.trim(),w=$('#vw').value.trim(),note=$('#vnt').value.trim();
  if(!pa&&!fc&&!spo2&&!gl&&!w)return toast('Inserisci almeno un parametro (es. Pressione)');
  const entry={ts:nt(),uid:me.uid,pa,fc,spo2,gl,w,note};
  const vits=[...(S.people[psel].vitals||[]),entry].slice(-40);
  D.put('people',psel,{vitals:vits},1);
  const sum=[pa&&'PA '+pa,fc&&'FC '+fc,spo2&&'SpO2 '+spo2+'%',gl&&'Glic/T '+gl,w&&w+'kg'].filter(Boolean).join(', ');
  fd('ha registrato parametri ('+sum+')'+(note?' — '+note:''),psel,'vit');
  return;
 }
 if(a=='delvit'){
  const ts=+b.dataset.j;
  const vits=(S.people[psel].vitals||[]).filter(v=>v.ts!==ts);
  D.put('people',psel,{vitals:vits},1);
  return;
 }
 if(a=='addc'){const n=$('#cn').value.trim();if(!n)return toast('Scrivi il nome');D.put('contacts',rid(),{name:n,info:$('#ci').value,tel:$('#ct').value});fd('ha aggiunto ai contatti: '+n);return}
 if(a=='delc')return D.del('contacts',i);
 if(a=='adds'){const pid=$('#sp').value,ty=$('#sy').value,dt=$('#sd').value;if(!dt)return toast('Indica la data');D.put('shifts',rid(),{uid:me.uid,pid,type:ty,date:dt,time:$('#st').value});fd('ha preso turno ('+ty+') del '+dt+' alle '+$('#st').value,pid);return}
 if(a=='dels')return D.del('shifts',i);
 if(a=='log'){const t=$('#lt').value.trim(),pid=$('#lp').value;if(!t)return toast('Scrivi una riga');$('#lt').value='';fd(t,pid,'log');return}
 if(a=='ren'){const t=prompt('Titolo',S.tasks[i].title);if(t)D.put('tasks',i,{title:t},1);return}
 if(a=='delt'){if(confirm('Eliminare impegno e relative note?')){Object.entries(S.notes).filter(([,n])=>n.task==i).forEach(([k])=>D.del('notes',k));D.del('tasks',i)}return}
 if(a=='addn'){open.add(i);D.put('notes',rid(),{task:i,text:'',items:[],imgs:[],files:[],ts:nt(),by:me.uid});fd('ha aggiunto una nota a "'+((S.tasks[i]||{}).title||pn(i))+'"',S.people[i]?i:'','note');return}
 if(a=='addng'){
  const tgt=$('#n_target').value||'gen',txt=($('#n_quick').value||'').trim();
  const nk=rid();
  D.put('notes',nk,{task:tgt,text:txt,items:[],imgs:[],files:[],ts:nt(),by:me.uid});
  fd('ha aggiunto una nota'+(txt?': "'+txt.slice(0,40)+'"':''),S.people[tgt]?tgt:'','note');
  return;
 }
 if(a=='deln'){if(confirm('Eliminare la nota?'))D.del('notes',i);return}
 if(a=='addi')return upd(i,n=>n.items.push({t:'',d:false}));
 if(a=='deli')return upd(i,n=>n.items.splice(j,1));
 if(a=='deli2')return upd(i,n=>n.imgs.splice(j,1));
 if(a=='delf')return upd(i,n=>n.files.splice(j,1));
 if(a=='pic')return pick('image/*',async f=>{const s=await shrink(f);upd(i,n=>n.imgs.push(s));fd('ha allegato una foto/referto a una nota',S.people[S.notes[i]?.task]?S.notes[i].task:'','note')});
 if(a=='att')return pick('*/*',async f=>{if(f.size>600000)return toast('File troppo grande (max 600 KB)');const d=await rd(f);upd(i,n=>n.files.push({name:f.name,data:d}));fd('ha allegato il file '+f.name,S.people[S.notes[i]?.task]?S.notes[i].task:'','note')});
});

document.addEventListener('change',e=>{
 const c=e.target.dataset.c;if(!c)return;
 if(c=='when')return D.put('tasks',e.target.dataset.i,{sel:{[me.uid]:{st:'yes',when:e.target.value}}},1);
 if(c=='role')return D.put('members',e.target.dataset.i,{role:e.target.value},1);
 if(c=='sc'){
  const f=e.target.dataset.f,val=e.target.value;
  D.put('people',psel,{[f]:val},1);
  const label=(FL.find(x=>x[0]==f)||[,'campo'])[1].split(' (')[0];
  fd('ha aggiornato "'+label+'" nella scheda di '+pn(psel),psel,'sc');
  return;
 }
 if(c=='th'){
  const th=[...document.querySelectorAll('.tp')].map(r=>{const q=r.querySelectorAll('input');return{d:q[0].value,q:q[1].value,t:q[2].value,n:q[3].value,s:q[4].value}});
  D.put('people',psel,{therapy:th},1);
  fd('ha aggiornato la terapia farmacologica di '+pn(psel),psel,'th');
  return;
 }
 if(c=='note')readNote(e.target.closest('.note'));
});
document.addEventListener('focusout',()=>setTimeout(()=>pend&&render(),200));
$('#out').onclick=()=>firebase.auth().signOut().then(()=>location.reload());
init();
